# Security scan (gitleaks, trivy, opengrep) through the reusable workflow of
# maestra-io/github-actions. PR only, by Igor's decision 17.11.2026 (issues-maestra#1649): a PR
# fails only on findings it introduces; no schedule. workflow_dispatch runs the full scan by hand.
# Accepted findings: .gitleaksignore / gitleaks:allow, .trivyignore, nosemgrep.
name: security-scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # nora OIDC token for the scanner downloads

jobs:
  scan:
    uses: maestra-io/github-actions/.github/workflows/security-scan.yml@main
